[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipa"
version = "0.1.0"
description = "Property Intelligence Platform Analysis — county-backed property research for Fairfax and Loudoun County, VA"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Web framework
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",

    # Database
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",

    # Data validation
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    # HTTP clients
    "httpx>=0.27",

    # CLI
    "click>=8.0",
    "rich>=13.0",

    # Configuration
    "pyyaml>=6.0",
    "python-dotenv>=1.0",

    # Financial calculations
    "numpy-financial>=1.0",

    # Report generation
    "jinja2>=3.1",

    # Scraping
    "playwright>=1.40",

    # Scheduling
    "apscheduler>=3.10",
]

[project.optional-dependencies]
pdf = [
    "weasyprint>=62.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "respx>=0.21",
    "httpx>=0.27",
    "ruff>=0.3",
]

[project.scripts]
pipa = "pipa.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
